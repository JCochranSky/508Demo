<!doctype html>
<!-- INTENTIONAL ISSUES: no lang on <html>, low-contrast, missing labels/alt, vague links, bad table, etc. -->
<html>
<head>
  <meta charset="utf-8">
  <title>Department of Community Benefits</title>
  <style>
    /* INTENTIONAL: low contrast button (same fg/bg tone) */
    .btn { background:#2aa666; color:#2aa666; padding:10px 14px; border:none; }
    .muted { color:#9a9a9a; }
    .nav a { text-decoration:none; color:#0a84ff; }
    .card { border:1px solid #ddd; padding:12px; border-radius:8px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  </style>
</head>
<body>
  <header>
    <h1>Department of Community Benefits</h1>
    <nav class="nav">
      <a href="#">Home</a> <!-- vague + # -->
      <a href="#programs">Learn more</a> <!-- vague link text -->
      <a href="#apply">Click here</a> <!-- vague link text -->
    </nav>
  </header>

  <!-- INTENTIONAL: empty alt for informative image -->
  <img src="hero.jpg" alt="">

  <main>
    <section class="card" id="programs">
      <h2>Programs</h2>
      <!-- INTENTIONAL: role button with no name, no text -->
      <div role="button" tabindex="0" onclick="alert('Opening…')"></div>

      <!-- INTENTIONAL: table with no <th>, no scope/headers -->
      <table border="1" width="100%">
        <caption>Benefit Amounts</caption>
        <tr><td>Program</td><td>Amount</td><td>FY</td></tr>
        <tr><td>Housing</td><td>1200</td><td>2025</td></tr>
        <tr><td>Food</td><td>300</td><td>2025</td></tr>
      </table>
    </section>

    <section class="card" id="apply">
      <h2>Apply for Benefits</h2>
      <form>
        <!-- INTENTIONAL: label not associated with input -->
        <label>Applicant Name</label>
        <input type="text" name="fullname" placeholder="Jane Doe">

        <!-- INTENTIONAL: radio group without fieldset/legend -->
        <div>
          <p class="muted">Preferred Contact</p>
          <input type="radio" id="c1" name="contact"><label for="c1">Email</label>
          <input type="radio" id="c2" name="contact"><label for="c2">Phone</label>
        </div>

        <!-- INTENTIONAL: button missing type; color contrast fail -->
        <button class="btn" onclick="submit()">Submit</button>
      </form>

      <!-- INTENTIONAL: iframe without title -->
      <iframe src="https://www.youtube.com/embed/DpDpue1s_Kw" width="420" height="236"></iframe>
    </section>

    <!-- INTENTIONAL: link target opens new tab without warning and vague text -->
    <p class="muted">
      For more info <a href="https://example.gov/benefits" target="_blank">here</a>.
    </p>
  </main>

  <footer>
    <p>© Dept. of Community Benefits</p>
  </footer>

  <!-- INTENTIONAL: possible console error usage of globalThis -->
  <script>try{globalThis.nonexistent()}catch(e){}</script>
</body>
</html>
