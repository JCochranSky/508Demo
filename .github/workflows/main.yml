name: Accessibility Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-a11y:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.API_URL }}  # <- your secret URL
      MAX_ERRORS: "0"                  # fail if total <tr class="error"> exceeds this
      HTML_GLOB: "index.html"          # or "**/*.html"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser deps
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Find HTML files
        id: files
        run: |
          shopt -s globstar nullglob
          files=( $HTML_GLOB )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No HTML files matched pattern '${HTML_GLOB}'."
            exit 1
          fi
          printf '%s\n' "${files[@]}" > html_files.txt
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"

      - name: Create parser script
        run: |
          cat > parse_reports.py <<'PY'
          import glob, os
          from bs4 import BeautifulSoup

          def text(el):
              return ' '.join((el.get_text(" ", strip=True) if el else "").split())

          reports = sorted(glob.glob("a11y-reports/*.html"))
          total = 0
          summary = []

          for rp in reports:
              with open(rp, "rb") as f:
                  soup = BeautifulSoup(f.read(), "lxml")

              # Count error rows
              error_rows = soup.select('tr.error') + soup.select('tr[class*="error"]')
              count = len(error_rows)
              total += count

              # Pull details if the HTMLCodeSniffer table is present
              table = soup.find(id="test-results-table")
              extracted = []
              if table:
                  for tr in table.find_all("tr"):
                      cls = ' '.join(tr.get("class", []))
                      if "error" in cls:
                          tds = tr.find_all("td")
                          principle = text(tds[1]) if len(tds) > 1 else ""
                          message   = text(tds[2]) if len(tds) > 2 else ""
                          code      = text(tds[3]) if len(tds) > 3 else ""
                          extracted.append((principle, message, code))
              else:
                  for tr in error_rows[:10]:
                      tds = tr.find_all("td")
                      msg = text(tds[2]) if len(tds) > 2 else text(tr)
                      code = text(tds[3]) if len(tds) > 3 else ""
                      extracted.append(("", msg, code))

              file_display = os.path.basename(rp)
              summary.append(f"## {file_display}\n- Errors: **{count}**")
              for (principle, message, code) in extracted[:10]:
                  line = f"* {message}"
                  if principle:
                      line = f"* [{principle}] {message}"
                  if code:
                      code_short = (code[:140] + "…") if len(code) > 140 else code
                      line += f" — `{code_short}`"
                  summary.append(line)

          with open("SUMMARY.md", "w", encoding="utf-8") as f:
              f.write("\n".join(summary) + "\n")
          with open("TOTAL_ERRORS.txt", "w") as f:
              f.write(str(total))
          PY

      - name: Call accessibility API and save reports
        run: |
          mkdir -p a11y-reports
          while IFS= read -r file; do
            echo "Checking: $file"
            # URL-encode the file contents into 'source', with engine=htmlcs
            # curl adds application/x-www-form-urlencoded automatically, but we set charset too.
            curl -sS -X POST "$API_URL" \
              -H "Content-Type: application/x-www-form-urlencoded; charset=UTF-8" \
              --data-urlencode "source@$file" \
              --data "engine=htmlcs" \
              -o "a11y-reports/$(echo "$file" | tr '/ ' '__').html"
          done < html_files.txt

      - name: Parse reports and gate
        id: gate
        run: |
          python parse_reports.py
          cat SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          total_errors=$(cat TOTAL_ERRORS.txt)
          echo "total_errors=$total_errors" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total errors across files: $total_errors**" >> "$GITHUB_STEP_SUMMARY"
          echo "**Fail threshold (MAX_ERRORS): ${MAX_ERRORS}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total_errors" -gt "$MAX_ERRORS" ]; then
            echo "::error title=Accessibility gate failed::Found $total_errors errors (max allowed: $MAX_ERRORS)"
            exit 1
          fi
          echo "Accessibility gate passed"

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-html-reports
          path: a11y-reports/
